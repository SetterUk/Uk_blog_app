{% extends "base.html"%}
{% block content%}
{%if user.is_authenticated%}

<h1>Update post....</h1>

<div class = "form-group">
<form method="POST" action="{% url 'add_post' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-secondary">Edit Post</button>
</div>
{%else%}
<p>You need to be logged in to update a post.</p>
<a href="{%url 'login'%}" class="btn btn-primary">Login</a>
{%endif%}


{% endblock %}
