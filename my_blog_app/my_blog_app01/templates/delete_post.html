{% extends "base.html"%}
{% block content%}
{%if user.is_authenticated%}
<h1>Delete Post.....</h1>

<div class="form-group">
<form method="POST">
    {% csrf_token %}
    <strong>Are you sure you want to delete this post?</strong><br/><br/>
    <button type="submit" class="btn btn-danger">Delete Post</button>
    <a href="{% url 'article_detail' object.pk %}" class="btn btn-secondary">Cancel</a>
</form>
</div>
{%else%}
<p>You need to be logged in to do that.</p>
<a href="{%url 'login'%}" class="btn btn-primary">Login</a>{% endif %}

{% endblock %}
