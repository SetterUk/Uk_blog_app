{% extends "base.html"%}
{% block content%}

<h1>Delete Post.....</h1>

<div class="form-group">
<form method="POST">
    {% csrf_token %}
    <strong>Are you sure you want to delete this post?</strong><br/><br/>
    <button type="submit" class="btn btn-danger">Delete Post</button>
    <a href="{% url 'article_detail' article.pk %}" class="btn btn-secondary">Cancel</a>
</form>
</div>
{% endblock %}
